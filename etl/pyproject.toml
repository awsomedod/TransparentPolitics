[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "transparentpolitics-etl"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    # Dagster core + UI
    "dagster>=1.7",
    "dagster-webserver>=1.7",
    "dagster-postgres>=0.23",   # store run history in PostgreSQL (vs SQLite default)

    # HTTP + data
    "httpx>=0.27",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "feedparser>=6.0",

    # Storage
    "minio>=7.0",
    "opensearch-py>=2.4",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["assets", "clients", "normalizers", "resolvers"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
