[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "transparentpolitics-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",   # includes uvicorn[standard]
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",              # async PostgreSQL driver
    "alembic>=1.13",
    "pydantic-settings>=2.0",
    "redis>=5.0",
    "httpx>=0.27",                # HTTP client for upstream API calls
    "feedparser>=6.0",            # RSS parsing
    "minio>=7.0",                 # raw response storage
    "opensearch-py>=2.4",
    "celery[redis]>=5.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
